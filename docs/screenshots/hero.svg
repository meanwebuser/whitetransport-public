<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Схема WhiteTransport</title>
  <desc id="desc">Приложения передают трафик в WhiteTransport, который выбирает доступные провайдеры и carrier-маршруты для соединения с exit-node и интернетом.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#132c4d"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1400" height="560" rx="32" fill="url(#background)"/>
  <text x="700" y="64" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">Интернет через доступный маршрут</text>
  <text x="700" y="98" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="18">WhiteTransport выбирает carrier по политике и переключается при сбое</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="55" y="190" width="225" height="180" rx="24" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="168" y="242" text-anchor="middle" fill="#dbeafe" font-size="24" font-weight="700">Приложения</text>
    <text x="168" y="282" text-anchor="middle" fill="#bfdbfe" font-size="18">Android · iOS</text>
    <text x="168" y="312" text-anchor="middle" fill="#bfdbfe" font-size="18">Desktop · Server</text>
    <text x="168" y="342" text-anchor="middle" fill="#93c5fd" font-size="16">SOCKS5 / system VPN</text>

    <rect x="390" y="145" width="330" height="270" rx="28" fill="#0f2538" stroke="url(#core)" stroke-width="4"/>
    <text x="555" y="205" text-anchor="middle" fill="#f0fdfa" font-size="28" font-weight="800">WhiteTransport</text>
    <rect x="432" y="235" width="246" height="48" rx="14" fill="#164e63"/>
    <text x="555" y="266" text-anchor="middle" fill="#cffafe" font-size="18">зашифрованная fabric</text>
    <rect x="432" y="300" width="246" height="48" rx="14" fill="#14532d"/>
    <text x="555" y="331" text-anchor="middle" fill="#dcfce7" font-size="18">policy · health · failover</text>
    <text x="555" y="382" text-anchor="middle" fill="#a7f3d0" font-size="16">один runtime — много путей</text>

    <rect x="830" y="125" width="300" height="310" rx="26" fill="#211840" stroke="#a78bfa" stroke-width="2"/>
    <text x="980" y="172" text-anchor="middle" fill="#ede9fe" font-size="24" font-weight="700">Providers / carriers</text>
    <g fill="#ddd6fe" font-size="17">
      <text x="875" y="216">VK · OK</text>
      <text x="875" y="252">WBStream · Telemost · DION</text>
      <text x="875" y="288">Yandex Disk · Git · Mail</text>
      <text x="875" y="324">SSH · sing-box VLESS</text>
      <text x="875" y="360">свой adapter / чужой код</text>
    </g>
    <text x="980" y="405" text-anchor="middle" fill="#c4b5fd" font-size="15">доступность зависит от настройки и сети</text>

    <rect x="1220" y="190" width="140" height="180" rx="24" fill="#134e4a" stroke="#5eead4" stroke-width="2"/>
    <text x="1290" y="247" text-anchor="middle" fill="#ccfbf1" font-size="21" font-weight="700">Exit-node</text>
    <path d="M1260 285h60M1260 305h60M1260 325h60" stroke="#99f6e4" stroke-width="5" stroke-linecap="round"/>
    <text x="1290" y="350" text-anchor="middle" fill="#99f6e4" font-size="16">Интернет</text>
  </g>

  <g stroke="#7dd3fc" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M280 280 H370"/>
    <path d="M720 280 H810"/>
    <path d="M1130 280 H1200"/>
  </g>

  <text x="700" y="505" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="16">Схема продукта, не результат live-теста конкретного провайдера</text>
</svg>
